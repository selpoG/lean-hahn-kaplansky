name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
          build-args: HahnKaplanskyRealClosedness HahnKaplanskyRealClosedness.Examples

      - name: Build the complete public library
        run: lake build HahnKaplanskyRealClosedness HahnKaplanskyRealClosedness.Examples HahnKaplanskyRealClosedness.AxiomAudit

      - name: Run the canonical public smoke tests
        run: |
          lake env lean HahnKaplanskyRealClosedness/Smoke.lean
          lake env lean HahnKaplanskyRealClosedness/PuiseuxSmoke.lean

      - name: Audit the public theorem axioms
        run: |
          lake env lean HahnKaplanskyRealClosedness/AxiomAudit.lean > axiom-report.txt
          if grep -Fq "sorryAx" axiom-report.txt; then
            cat axiom-report.txt
            exit 1
          fi
          if rg -n '^[[:space:]]*(axiom|unsafe|set_option)[[:space:]]|\b(sorry|admit)\b' \
              HahnKaplanskyRealClosedness HahnKaplanskyRealClosedness.lean --glob '*.lean'; then
            exit 1
          fi
          cat axiom-report.txt

      - name: Run the mathlib style linter
        run: lake exe lint-style HahnKaplanskyRealClosedness HahnKaplanskyRealClosedness.Examples HahnKaplanskyRealClosedness.AxiomAudit HahnKaplanskyRealClosedness.Smoke HahnKaplanskyRealClosedness.PuiseuxSmoke

  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            texlive-lang-japanese texlive-latex-extra texlive-fonts-recommended ripgrep
      - name: Build English and Japanese proof PDFs
        run: task proof-pdf
